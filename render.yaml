services:
  - type: static_site
    name: echoai-frontend
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: cd echo-ai-frontend && npm install && npm run build
    staticPublishPath: echo-ai-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_VAPID_KEY
        sync: false
  - type: web
    name: echoai-backend
    runtime: python
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn echo_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_STUB_AI
        value: "false"
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: RUN_STARTUP_MIGRATIONS
        value: "true"
